<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI BVNT An Giang — API Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a1520; color: #e0f0ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: linear-gradient(135deg, #0f2038, #162d50); border: 1px solid #2a4a72; border-radius: 16px; padding: 40px; max-width: 480px; width: 90%; text-align: center; }
    h1 { font-size: 20px; margin-bottom: 8px; color: #7fc2ff; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin: 16px 0; padding: 8px 16px; background: #0a3434; border-radius: 8px; border: 1px solid #008080; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .info { font-size: 13px; color: #6b8aaa; margin-top: 12px; line-height: 1.6; }
    code { background: #0a1525; padding: 2px 8px; border-radius: 4px; color: #4ade80; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>KPI BVNT An Giang</h1>
    <p style="color:#6b8aaa;font-size:13px">Shared Calendar API</p>
    <div class="status"><span class="dot"></span> Online</div>
    <div class="info">
      <p>Endpoints:</p>
      <p><code>GET /api/entries?month=06</code></p>
      <p><code>POST /api/entries</code></p>
      <p><code>DELETE /api/entries?id=&month=&pw=</code></p>
    </div>
  </div>
</body>
</html>
